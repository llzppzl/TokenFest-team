server {
    listen 80;
    root /usr/share/nginx/html;

    # Coding agents send large requests
    client_max_body_size 32m;

    # Dashboard API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't fake their address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LLM proxy endpoints (OpenAI and Anthropic SDKs). No buffering so streams arrive live.
    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Single-page app: unknown paths load index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
