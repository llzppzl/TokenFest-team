name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Test summary
        if: always()
        run: |
          grep -h "Tests run" target/surefire-reports/*.txt || true
      - name: Make sure the PostgreSQL tests ran
        run: |
          grep -q "Skipped: 0" target/surefire-reports/com.tokenfest.gateway.repository.PostgresSchemaTests.txt
          grep -q "Skipped: 0" target/surefire-reports/com.tokenfest.gateway.integration.PostgresIntegrationTests.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

